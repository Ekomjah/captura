<svg width="100%" viewBox="0 0 690 690" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Captura favicon</title>
  <desc>A square app icon for Captura featuring a stylized screenshot capture mark</desc>

  <!-- Backdrop: warm darkroom near-black -->
  <rect width="680" height="680" rx="120" fill="#14110D"/>

  <!-- Focus frame + crosshair: safelight amber, low opacity -->
  <rect x="140" y="140" width="400" height="400" rx="32" fill="none" stroke="#F1932F" stroke-width="10" opacity="0.28"/>
  <line x1="340" y1="180" x2="340" y2="500" stroke="#F1932F" stroke-width="10" stroke-linecap="round" opacity="0.4"/>
  <line x1="180" y1="340" x2="500" y2="340" stroke="#F1932F" stroke-width="10" stroke-linecap="round" opacity="0.4"/>

  <!-- Corner brackets: safelight amber -->
  <g fill="none" stroke="#F1932F" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
    <path d="M140 220 V140 H220"/>
    <path d="M540 220 V140 H460"/>
    <path d="M140 460 V540 H220"/>
    <path d="M540 460 V540 H460"/>
  </g>

  <!-- Lens / aperture -->
  <circle cx="340" cy="340" r="38" fill="#F1932F"/>
  <circle cx="340" cy="340" r="22" fill="#14110D"/>
  <circle cx="340" cy="340" r="10" fill="#F1932F"/>
</svg>
