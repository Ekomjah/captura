services:
  db:
    image: postgres:16-alpine # alpine = smaller image
    container_name: captura_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5434:5432" # localhost:5432 → container:5432
    volumes:
      - captura_pgdata:/var/lib/postgresql/data # persist data between restarts
      # - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql # optional seed
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
  api:
    build:
      context: .
      dockerfile: Dockerfile
    develop:
      watch:
        - action: rebuild
          path: pyproject.toml
    volumes:
      - .:/api
      - /api/.venv-docker
    container_name: captura_api
    restart: unless-stopped
    ports:
      - "8080:8000"
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      CLERK_WEBHOOK_SECRET: ${CLERK_WEBHOOK_SECRET}
      CLERK_JWKS_URL: ${CLERK_JWKS_URL}
      CLERK_AUTHORIZED_PARTIES: ${CLERK_AUTHORIZED_PARTIES}
      
    depends_on:
      db:
        condition: service_healthy
      
volumes:
  captura_pgdata:


